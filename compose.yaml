x-rustfs: &rustfs
  image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
  platform: linux/amd64
  environment:
    RUSTFS_VOLUMES: "http://node{1...4}:9000/data"
    RUSTFS_ERASURE_SET_DRIVE_COUNT: "4"
    RUSTFS_STORAGE_CLASS_STANDARD: "EC:2"
    RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY}"
    RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY}"
    RUSTFS_CONSOLE_ENABLE: "true"
    RUSTFS_OBS_LOGGER_LEVEL: "info"
    RUSTFS_OBS_LOG_DIRECTORY: "/logs"
services:
  node1:
    <<: *rustfs
    container_name: rustfs-lab-node1
    hostname: node1
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./ui_disks/disk1:/data
      - ./ui_logs/node1:/logs
  node2:
    <<: *rustfs
    container_name: rustfs-lab-node2
    hostname: node2
    volumes:
      - ./ui_disks/disk2:/data
      - ./ui_logs/node2:/logs
  node3:
    <<: *rustfs
    container_name: rustfs-lab-node3
    hostname: node3
    volumes:
      - ./ui_disks/disk3:/data
      - ./ui_logs/node3:/logs
  node4:
    <<: *rustfs
    container_name: rustfs-lab-node4
    hostname: node4
    volumes:
      - ./ui_disks/disk4:/data
      - ./ui_logs/node4:/logs
